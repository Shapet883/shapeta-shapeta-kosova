<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAPETA CHESS KOSOVA</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    text-align: center;
}

header {
    background: #111111;
    color: white;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 10px 0 0;
    font-size: 18px;
}

.welcome {
    padding: 25px 15px;
}

.welcome h2 {
    font-size: 27px;
}

.welcome p {
    font-size: 18px;
}

.chessboard {
    width: 320px;
    height: 320px;
    margin: 20px auto 35px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    border: 6px solid #222222;
}

.square {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

.selected {
    outline: 3px solid red;
    outline-offset: -3px;
}

footer {
    background: #111111;
    color: white;
    padding: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
<h1>♟️ SHAPETA CHESS KOSOVA 🇽🇰</h1>
<p>Faqe për dashamirësit e shahut në Kosovë</p>
</header>

<section class="welcome">
<h2>Mirë se vini!</h2>
<p>
Mirë se vini në SHAPETA CHESS KOSOVA,
hapësira jonë për dashamirësit e shahut.
</p>
</section>

<div class="chessboard" id="chessboard">

<div class="square dark">♜</div>
<div class="square light">♞</div>

<div class="square dark">♟</div>

<div class="square light"></div>

<div class="square light"></div>
<div class="square dark"></div>

<div class="square dark"></div>

<div class="square dark"></div>

<footer>
SHAPETA CHESS KOSOVA 🇽🇰 — Dashamirësit e shahut në Kosovë
</footer>

<script>
const squares = document.querySelectorAll(".square");

let selectedPiece = null;

squares.forEach(function(square) {

    square.addEventListener("click", function() {

        if (selectedPiece === null) {

            if (this.textContent.trim() !== "") {
                selectedPiece = this;
                this.classList.add("selected");
            }

        } else {

            if (this !== selectedPiece) {
                this.textContent = selectedPiece.textContent;
                selectedPiece.textContent = "";
            }

            selectedPiece.classList.remove("selected");
            selectedPiece = null;
        }

    });

});
</script>


</body>
</html
