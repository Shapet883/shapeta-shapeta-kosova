}

    outline-offset: -3px;
}

<script>
const squares = document.querySelectorAll(".square");
let selectedPiece = null;

squares.forEach(function(square) {
    square.addEventListener("click", function() {

        if (selectedPiece === null) {
            if (this.textContent.trim() !== "") {
                selectedPiece = this;
                this.classList.add("selected");
            }
            return;
        }<script>
const s = document.querySelectorAll(".square");
let p = null;

const w = "♔♕♖♗♘♙";
const b = "♚♛♜♝♞♟";

function cw(x) {
    return w.includes(x);
}

function cb(x) {
    return b.includes(x);
}

function clear(a, d, z, q) {
    const r = Math.sign(z - a);
    const c = Math.sign(q - d);

    let y = a + r;
    let x = d + c;

    while (y !== z || x !== q) {
        if (s[y * 8 + x].textContent.trim() !== "") {
            return false;
        }
        y += r;
        x += c;
    }

    return true;
}

s.forEach(function(x) {
    x.addEventListener("click", function() {

        if (p === null) {
            if (this.textContent.trim() !== "") {
                p = this;
                this.classList.add("selected");
            }
            return;
        }

        if (this === p) {
            this.classList.remove("selected");
            p = null;
            return;
        }

        const a = Array.from(s).indexOf(p);
        const d = Array.from(s).indexOf(this);

        const r1 = Math.floor(a / 8);
        const c1 = a % 8;
        const r2 = Math.floor(d / 8);
        const c2 = d % 8;

        const f = p.textContent.trim();
        const t = this.textContent.trim();

        let ok = false;

        if (
            (cw(f) && cw(t)) ||
            (cb(f) && cb(t))
        ) {
            p.classList.remove("selected");
            p = null;
            return;
        }

        if (f === "♘" || f === "♞") {
            const r = Math.abs(r2 - r1);
            const c = Math.abs(c2 - c1);

            if (
                (r === 2 && c === 1) ||
                (r === 1 && c === 2)
            ) {
                ok = true;
            }
        }

        if (f === "♖" || f === "♜") {
            if (
                (r1 === r2 || c1 === c2) &&
                clear(r1, c1, r2, c2)
            ) {
                ok = true;
            }
        }

        if (f === "♗" || f === "♝") {
            const r = Math.abs(r2 - r1);
            const c = Math.abs(c2 - c1);

            if (
                r === c &&
                r !== 0 &&
                clear(r1, c1, r2, c2)
            ) {
                ok = true;
            }
        }

        if (f === "♕" || f === "♛") {
            const r = Math.abs(r2 - r1);
            const c = Math.abs(c2 - c1);

            if (
                (
                    r1 === r2 ||
                    c1 === c2 ||
                    r === c
                ) &&
                clear(r1, c1, r2, c2)
            ) {
                ok = true;
            }
        }

        if (f === "♔" || f === "♚") {
            const r = Math.abs(r2 - r1);
            const c = Math.abs(c2 - c1);

            if (
                r <= 1 &&
                c <= 1 &&
                (r !== 0 || c !== 0)
            ) {
                ok = true;
            }
        }

        if (f === "♙") {
            if (
                c1 === c2 &&
                r2 === r1 - 1 &&
                t === ""
            ) {
                ok = true;
            }

            if (
                Math.abs(c2 - c1) === 1 &&
                r2 === r1 - 1 &&
                cb(t)
            ) {
                ok = true;
            }

            if (
                c1 === c2 &&
                r1 === 6 &&
                r2 === 4 &&
                s[(r1 - 1) * 8 + c1].textContent.trim() === "" &&
                t === ""
            ) {
                ok = true;
            }
        }

        if (f === "♟") {
            if (
                c1 === c2 &&
                r2 === r1 + 1 &&
                t === ""
            ) {
                ok = true;
            }

            if (
                Math.abs(c2 - c1) === 1 &&
                r2 === r1 + 1 &&
                cw(t)
            ) {
                ok = true;
            }

            if (
                c1 === c2 &&
                r1 === 1 &&
                r2 === 3 &&
                s[(r1 + 1) * 8 + c1].textContent.trim() === "" &&
                t === ""
            ) {
                ok = true;
            }
        }

        if (ok) {
            this.textContent = f;
            p.textContent = "";
        }

        p.classList.remove("selected");
        p = null;
    });
});
</script>
